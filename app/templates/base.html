<!doctype html>
<html lang="{{ request.app.state.settings.app_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ t("app.name") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="{{ path('course_list') }}" class="brand">{{ t("app.name") }}</a></li></ul>
      <ul>
        <li><a href="{{ path('course_list') }}">{{ t("nav.courses") }}</a></li>
        <li><a href="{{ path('import_form') }}">{{ t("nav.import") }}</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
